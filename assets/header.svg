<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Guilherme Quirino</title>
  <desc id="desc">Desenvolvimento Backend Java, Dados e Business Intelligence</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="48%" stop-color="#123b67"/>
      <stop offset="100%" stop-color="#5b2da8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="1090" cy="40" r="170" fill="#7c3aed" opacity=".18"/>
  <circle cx="90" cy="280" r="155" fill="#0ea5e9" opacity=".16"/>
  <path d="M0 242 C260 198 430 295 700 242 S1000 190 1200 226 V300 H0Z" fill="#050b14" opacity=".55"/>
  <path d="M0 247 C260 203 430 300 700 247 S1000 195 1200 231" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".8"/>
  <text x="600" y="118" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="1">GUILHERME QUIRINO</text>
  <rect x="385" y="141" width="430" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  <text x="600" y="185" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="22">Backend Java • Dados &amp; BI • Automação</text>
  <text x="600" y="222" text-anchor="middle" fill="#a5c8ed" font-family="Consolas,monospace" font-size="16">&lt; construindo soluções, uma versão por vez /&gt;</text>
</svg>